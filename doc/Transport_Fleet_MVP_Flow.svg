<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200" role="img" aria-labelledby="title desc">
  <title id="title">UAE Transport Fleet MVP business flow</title>
  <desc id="desc">The diagram shows setup, customer work, owned and external vehicle allocation, per-trip and monthly billing, supplier and owned costs, payments, balances, and operational profit.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 46px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px Arial, sans-serif; fill: #475569; }
      .lane { font: 700 24px Arial, sans-serif; fill: #0f172a; letter-spacing: 1px; }
      .box-title { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .box-text { font: 400 19px Arial, sans-serif; fill: #334155; }
      .small { font: 400 17px Arial, sans-serif; fill: #475569; }
      .line { stroke: #334155; stroke-width: 5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="2000" height="1200" fill="#f8fafc"/>
  <text x="1000" y="70" text-anchor="middle" class="title">UAE Transport Fleet MVP</text>
  <text x="1000" y="108" text-anchor="middle" class="subtitle">One work record drives billing, payouts, expenses, balances, and profit</text>

  <rect x="55" y="145" width="1890" height="170" rx="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
  <text x="85" y="185" class="lane">1. SETUP ONCE</text>
  <g>
    <rect x="95" y="210" width="300" height="72" rx="16" fill="#ffffff" stroke="#38bdf8" stroke-width="3"/>
    <text x="245" y="254" text-anchor="middle" class="box-title">Business and Staff</text>
    <rect x="450" y="210" width="300" height="72" rx="16" fill="#ffffff" stroke="#38bdf8" stroke-width="3"/>
    <text x="600" y="254" text-anchor="middle" class="box-title">Customers</text>
    <rect x="805" y="210" width="300" height="72" rx="16" fill="#ffffff" stroke="#38bdf8" stroke-width="3"/>
    <text x="955" y="254" text-anchor="middle" class="box-title">Suppliers</text>
    <rect x="1160" y="210" width="300" height="72" rx="16" fill="#ffffff" stroke="#38bdf8" stroke-width="3"/>
    <text x="1310" y="254" text-anchor="middle" class="box-title">Vehicles and Drivers</text>
    <rect x="1515" y="210" width="300" height="72" rx="16" fill="#ffffff" stroke="#38bdf8" stroke-width="3"/>
    <text x="1665" y="254" text-anchor="middle" class="box-title">Agreements</text>
  </g>

  <rect x="55" y="345" width="1890" height="265" rx="24" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
  <text x="85" y="385" class="lane">2. CAPTURE WORK ONCE</text>

  <rect x="105" y="430" width="300" height="120" rx="18" fill="#ffffff" stroke="#10b981" stroke-width="4"/>
  <text x="255" y="478" text-anchor="middle" class="box-title">Customer Request</text>
  <text x="255" y="514" text-anchor="middle" class="box-text">Trip or monthly hire</text>

  <rect x="495" y="430" width="300" height="120" rx="18" fill="#ffffff" stroke="#10b981" stroke-width="4"/>
  <text x="645" y="478" text-anchor="middle" class="box-title">Work Order</text>
  <text x="645" y="514" text-anchor="middle" class="box-text">Route, date, charges</text>

  <rect x="900" y="398" width="360" height="86" rx="18" fill="#ffffff" stroke="#10b981" stroke-width="4"/>
  <text x="1080" y="450" text-anchor="middle" class="box-title">Owned Vehicle</text>
  <rect x="900" y="500" width="360" height="86" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="4"/>
  <text x="1080" y="552" text-anchor="middle" class="box-title">External Vehicle</text>

  <rect x="1360" y="430" width="460" height="120" rx="18" fill="#ffffff" stroke="#10b981" stroke-width="4"/>
  <text x="1590" y="478" text-anchor="middle" class="box-title">Complete Work</text>
  <text x="1590" y="514" text-anchor="middle" class="box-text">Confirm allocations and amounts</text>

  <path d="M 405 490 L 495 490" class="line"/>
  <path d="M 795 470 L 900 441" class="line"/>
  <path d="M 795 510 L 900 543" class="line"/>
  <path d="M 1260 441 L 1360 470" class="line"/>
  <path d="M 1260 543 L 1360 510" class="line"/>

  <rect x="55" y="640" width="1890" height="365" rx="24" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
  <text x="85" y="680" class="lane">3. BILL CUSTOMER AND SEPARATE COSTS</text>

  <rect x="105" y="715" width="350" height="100" rx="18" fill="#ffffff" stroke="#0284c7" stroke-width="4"/>
  <text x="280" y="756" text-anchor="middle" class="box-title">Per Trip</text>
  <text x="280" y="790" text-anchor="middle" class="box-text">Trip Sheet or invoice</text>

  <rect x="105" y="835" width="350" height="100" rx="18" fill="#ffffff" stroke="#0284c7" stroke-width="4"/>
  <text x="280" y="876" text-anchor="middle" class="box-title">Monthly Hire</text>
  <text x="280" y="910" text-anchor="middle" class="box-text">Base rate plus extras</text>

  <rect x="535" y="755" width="360" height="120" rx="18" fill="#ffffff" stroke="#0284c7" stroke-width="4"/>
  <text x="715" y="803" text-anchor="middle" class="box-title">Invoice and Statement</text>
  <text x="715" y="839" text-anchor="middle" class="box-text">PDF on demand</text>

  <rect x="670" y="900" width="320" height="80" rx="18" fill="#ffffff" stroke="#059669" stroke-width="4"/>
  <text x="830" y="934" text-anchor="middle" class="box-title">Owned Costs</text>
  <text x="830" y="963" text-anchor="middle" class="small">Fuel, driver, maintenance</text>

  <rect x="1040" y="900" width="340" height="80" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="4"/>
  <text x="1210" y="934" text-anchor="middle" class="box-title">Supplier Settlement</text>
  <text x="1210" y="963" text-anchor="middle" class="small">External vehicle payable</text>

  <rect x="1470" y="755" width="340" height="120" rx="18" fill="#ffffff" stroke="#0284c7" stroke-width="4"/>
  <text x="1640" y="803" text-anchor="middle" class="box-title">Payment In</text>
  <text x="1640" y="839" text-anchor="middle" class="box-text">Cash, bank, or cheque</text>

  <rect x="1470" y="900" width="340" height="80" rx="18" fill="#ffffff" stroke="#ea580c" stroke-width="4"/>
  <text x="1640" y="934" text-anchor="middle" class="box-title">Payment Out</text>
  <text x="1640" y="963" text-anchor="middle" class="small">Expenses and suppliers</text>

  <path d="M 455 765 L 535 795" class="line"/>
  <path d="M 455 885 L 535 835" class="line"/>
  <path d="M 895 815 L 1470 815" class="line"/>
  <path d="M 990 940 L 990 990 L 1440 990 L 1440 940 L 1470 940" class="line"/>
  <path d="M 1380 940 L 1470 940" class="line"/>
  <path d="M 1590 550 L 1590 630" class="line"/>

  <rect x="360" y="1040" width="1280" height="105" rx="24" fill="#0f172a"/>
  <text x="1000" y="1083" text-anchor="middle" style="font:700 30px Arial,sans-serif;fill:#ffffff">4. OWNER RESULT</text>
  <text x="1000" y="1122" text-anchor="middle" style="font:400 23px Arial,sans-serif;fill:#e2e8f0">Customer Balance  +  Supplier Balance  +  Vehicle Cost  +  Operational Profit</text>

  <path d="M 1640 875 L 1460 1040" class="line"/>
  <path d="M 1640 980 L 1545 1040" class="line"/>
</svg>
